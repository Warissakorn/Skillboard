<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <title>Skilltape</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="app-header">
    <div class="brand"><span class="brand-mark" aria-hidden="true">S</span><div><h1>Skilltape</h1></div></div>
    <div class="header-actions">
    <button id="miniWindowBtn" class="footer-btn" type="button" title="เปิดค้างและปรับขนาดได้ ใช้ Prompt กับแท็บที่เลือกในหน้าต่างเดิม">หน้าต่างย่อ ↗</button>
    <button id="addSkillBtn" class="primary-btn" type="button">＋ เพิ่ม Skill</button>
    </div>
  </header>

  <main id="app">
    <section class="search-section">
      <label class="visually-hidden" for="searchInput">คลัง Prompt ของคุณ</label>
      <input
        id="searchInput"
        type="search"
        placeholder="ค้นหาชื่อหรือเนื้อหา Prompt…"
      />
      <p aria-live="polite" id="resultCount" class="result-count"></p>
    </section>

    <section class="list-section">
      <ul id="skillList"></ul>
      <p id="emptyState" class="empty-state" hidden>ยังไม่มี Skill — กด “＋ เพิ่ม Skill” เพื่อเก็บ Prompt แรกของคุณ</p>
      <p id="noResultsState" class="empty-state" hidden>ไม่พบ Skill ลองเปลี่ยนคำค้นหรือล้างช่องค้นหา</p>
    </section>

    <div role="status" aria-live="polite" id="toast" class="toast" hidden></div>
  </main>

  <footer class="app-footer">
    <button id="exportBtn" class="footer-btn">ส่งออก JSON</button>
    <button id="importBtn" class="footer-btn">นำเข้า JSON</button>
    <input id="importFileInput" type="file" accept=".json,application/json" hidden />
  </footer>

    <dialog id="editorDialog" class="form-section" aria-labelledby="editorTitle">
      <h2 id="editorTitle">เพิ่ม Skill</h2>
      <form id="skillForm" novalidate>
        <div class="field">
          <label for="skillName">ชื่อ</label>
          <input id="skillName" type="text" maxlength="100" placeholder="เช่น สรุปบทความให้กระชับ" />
        </div>
        <div class="field">
          <label for="skillContent">เนื้อหา</label>
          <textarea id="skillContent" rows="4" placeholder="วางเนื้อหา skill/prompt ที่นี่..."></textarea>
        </div>
        <p id="formError" role="alert" class="form-error" hidden></p>
        <div class="form-actions">
          <button type="submit" id="saveBtn">บันทึก Skill</button>
          <button type="button" id="cancelEditBtn" class="footer-btn">ยกเลิก</button>
        </div>
      </form>
    </dialog>


  <dialog id="previewDialog" aria-labelledby="previewTitle">
    <h2 id="previewTitle"></h2>
    <div id="previewContent" class="full-preview"></div>
    <button id="closePreviewBtn" class="footer-btn" type="button">ปิด</button>
  </dialog>
  <dialog id="importDialog" aria-labelledby="importTitle">
    <h2 id="importTitle">นำเข้า Skills</h2>
    <p>เลือกวิธีนำเข้าไฟล์ของคุณ การแทนที่จะลบรายการเดิมทั้งหมด</p>
    <p id="importError" class="form-error" role="alert" hidden></p>
    <div class="dialog-actions">
      <button id="mergeImportBtn" type="button">รวมกับข้อมูลเดิม</button>
      <button id="replaceImportBtn" type="button">แทนที่ทั้งหมด</button>
      <button id="cancelImportBtn" type="button">ยกเลิก</button>
    </div>
  </dialog>
  <script src="../utils/storage.js"></script>
  <script src="window-mode.js"></script>
  <script src="popup.js"></script>
</body>
</html>
