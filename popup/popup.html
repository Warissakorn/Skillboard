<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <title>Skilltape</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="app-header">
    <h1>🎧 Skilltape</h1>
    <p class="tagline">your mixtape of prompts</p>
  </header>

  <main id="app">
    <section class="form-section">
      <form id="skillForm" novalidate>
        <div class="field">
          <label for="skillName">ชื่อ</label>
          <input id="skillName" type="text" maxlength="100" placeholder="เช่น สรุปบทความให้กระชับ" />
        </div>
        <div class="field">
          <label for="skillContent">เนื้อหา</label>
          <textarea id="skillContent" rows="4" placeholder="วางเนื้อหา skill/prompt ที่นี่..."></textarea>
        </div>
        <div class="field">
          <label for="skillCategory">หมวดหมู่</label>
          <select id="skillCategory">
            <option value="general">ทั่วไป</option>
            <option value="coding">โค้ดดิ้ง</option>
            <option value="writing">งานเขียน</option>
            <option value="business">ธุรกิจ</option>
          </select>
        </div>
        <p id="formError" class="form-error" hidden></p>
        <div class="form-actions">
          <button type="submit" id="saveBtn">💾 บันทึก skill</button>
          <button type="button" id="cancelEditBtn" class="footer-btn" hidden>ยกเลิกการแก้ไข</button>
        </div>
      </form>
    </section>

    <section class="search-section">
      <input
        id="searchInput"
        type="search"
        placeholder="🔍 ค้นหา skill..."
      />
      <div id="categoryChips" class="category-chips">
        <button type="button" class="chip is-active" data-category="all">ทั้งหมด</button>
        <button type="button" class="chip" data-category="general">ทั่วไป</button>
        <button type="button" class="chip" data-category="coding">โค้ดดิ้ง</button>
        <button type="button" class="chip" data-category="writing">งานเขียน</button>
        <button type="button" class="chip" data-category="business">ธุรกิจ</button>
      </div>
      <p id="resultCount" class="result-count"></p>
    </section>

    <section class="list-section">
      <ul id="skillList"></ul>
      <p id="emptyState" class="empty-state" hidden>ยังไม่มี skill ในเทปของคุณ 🎵</p>
      <p id="noResultsState" class="empty-state" hidden>ไม่เจอ skill ที่ค้นหา 🔍</p>
    </section>

    <div id="toast" class="toast" hidden></div>
  </main>

  <footer class="app-footer">
    <button id="exportBtn" class="footer-btn">⬇️ Export</button>
    <button id="importBtn" class="footer-btn">⬆️ Import</button>
    <input id="importFileInput" type="file" accept=".json,application/json" hidden />
  </footer>

  <script src="../utils/storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
